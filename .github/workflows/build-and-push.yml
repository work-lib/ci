# Wrapper de compatibilité : mappe les anciens inputs (STAGING_BRANCH, AUTOTEST_MODE)
# vers ENVIRONMENT et appelle build-one-product.
# Pour les nouveaux workflows, utiliser directement build-one-product.yml.

name: Build and Push (compat)

on:
  workflow_call:
    inputs:
      NEEDS_MIGRATION:
        type: boolean
        required: false
        default: false
      NEEDS_IMAGE_BUILD:
        type: boolean
        required: false
        default: true
      NEEDS_DEPLOY:
        type: boolean
        required: false
        default: true
      AUTOTEST_MODE:
        type: boolean
        required: false
        default: false
      IMAGE_TAG:
        type: string
        required: false
      MICROSERVICE:
        type: string
        required: false
      ECR_REPOSITORY:
        type: string
        required: false
      PRODUCTION_BRANCH:
        type: string
        required: false
        default: "main"
      STAGING_BRANCH:
        type: string
        required: false
        default: "staging"
    secrets:
      WORKLIB_GITHUB_SSH_KEY:
        required: true
      AWS_ACCESS_KEY_ID_DEV:
        required: true
      AWS_SECRET_ACCESS_KEY_DEV:
        required: true
      AWS_ROLE_EXTERNAL_ID_DEV:
        required: true
      AWS_ROLE_TO_ASSUME_DEV:
        required: true
      QA_SLACK_WEBHOOK_URL:
        required: true
      PPD_SLACK_WEBHOOK_URL:
        required: true
      AWS_ACCESS_KEY_ID_PROD:
        required: true
      AWS_SECRET_ACCESS_KEY_PROD:
        required: true
      AWS_ROLE_EXTERNAL_ID_PROD:
        required: true
      AWS_ROLE_TO_ASSUME_PROD:
        required: true
      PRD_SLACK_WEBHOOK_URL:
        required: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
    steps:
      - name: Map to ENVIRONMENT
        id: set-env
        run: |
          if [[ "${{ inputs.AUTOTEST_MODE }}" == "true" ]]; then
            echo "environment=autotest" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "environment=main" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref_name }}" == "staging" ]] || [[ "${{ github.ref_name }}" =~ ^staging/ ]]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi

  build:
    needs: prepare
    uses: ./.github/workflows/build-one-product.yml
    with:
      ENVIRONMENT: ${{ needs.prepare.outputs.environment }}
      MICROSERVICE: ${{ inputs.MICROSERVICE }}
      IMAGE_TAG: ${{ inputs.IMAGE_TAG }}
      NEEDS_MIGRATION: ${{ inputs.NEEDS_MIGRATION }}
      NEEDS_IMAGE_BUILD: ${{ inputs.NEEDS_IMAGE_BUILD }}
      ECR_REPOSITORY: ${{ inputs.ECR_REPOSITORY }}
      PRODUCTION_BRANCH: ${{ inputs.PRODUCTION_BRANCH }}
    secrets: inherit
