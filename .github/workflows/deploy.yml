name: Deploy to EKS

on:
  workflow_call:
    inputs:
      TARGET_ENV:
        type: string
        required: true
      NEEDS_MIGRATION:
        type: boolean
        required: false
        default: false
      TEST_MODE:
        type: boolean
        required: false
        default: false
    secrets:
      WORKLIB_GITHUB_SSH_KEY:
        required: true
      # QA and preprod
      AWS_ACCESS_KEY_ID_DEV:
        required: true
      AWS_SECRET_ACCESS_KEY_DEV:
        required: true
      AWS_ROLE_EXTERNAL_ID_DEV:
        required: true
      AWS_ROLE_TO_ASSUME_DEV:
        required: true
      QA_SLACK_WEBHOOK_URL:
        required: true
      # preprod
      PPD_SLACK_WEBHOOK_URL:
        required: true
      # prod
      AWS_ACCESS_KEY_ID_PROD:
        required: true
      AWS_SECRET_ACCESS_KEY_PROD:
        required: true
      AWS_ROLE_EXTERNAL_ID_PROD:
        required: true
      AWS_ROLE_TO_ASSUME_PROD:
        required: true
      PRD_SLACK_WEBHOOK_URL:
        required: true

jobs:
  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.set-tag.outputs.branch }}
      microservice: ${{ steps.set-tag.outputs.microservice_short_name }}
      deploy_type: ${{ steps.set-tag.outputs.deploy_type }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.ref_name }}

      - name: Set tag
        id: set-tag
        run: |
          GIT_TAG="${{ github.event.inputs.image-tag }}"
          GIT_BRANCH=$(echo ${GITHUB_REF#refs/heads/} | awk -F'/' '{ print $NF}')
          MICROSERVICE=$(echo ${GITHUB_REPOSITORY} | awk -F'/' '{ print $NF}')
          MICROSERVICE_SHORT_NAME=$(echo ${MICROSERVICE} | awk -F'service-' '{ print $NF}')
          deploy_type="deployment"

          echo "TARGET_ENV=${{ inputs.TARGET_ENV }}"
          echo "TEST_MODE=${{ inputs.TEST_MODE }}"
          echo "GIT_BRANCH=${GIT_BRANCH}  GIT_TAG=${GIT_TAG}"
          echo "MICROSERVICE=${MICROSERVICE}  SHORT=${MICROSERVICE_SHORT_NAME}"
          echo "NEEDS_MIGRATION=${{ inputs.NEEDS_MIGRATION }}"

          echo "branch=$GIT_BRANCH" >> $GITHUB_OUTPUT
          echo "tag=$GIT_TAG" >> $GITHUB_OUTPUT
          echo "microservice=$MICROSERVICE" >> $GITHUB_OUTPUT
          echo "microservice_short_name=$MICROSERVICE_SHORT_NAME" >> $GITHUB_OUTPUT
          echo "deploy_type=$deploy_type" >> $GITHUB_OUTPUT

      - name: Map environment config
        run: |
          REPO_NAME="gekko/${{ steps.set-tag.outputs.microservice }}"
          case "${{ inputs.TARGET_ENV }}" in
            production)
              {
                echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID_PROD }}"
                echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}"
                echo "AWS_ROLE_EXTERNAL_ID=${{ secrets.AWS_ROLE_EXTERNAL_ID_PROD }}"
                echo "AWS_ROLE_TO_ASSUME=${{ secrets.AWS_ROLE_TO_ASSUME_PROD }}"
                echo "REPO_NAME=${REPO_NAME}"
                echo "EKS_CLUSTER_NAME=gek-prd"
                echo "environment=production"
                echo "NODE_ENV=production"
                echo "K8S_NAMESPACE=worklib"
                echo "SLACK_WEBHOOK_URL=${{ secrets.PRD_SLACK_WEBHOOK_URL }}"
                echo "DB_INSTANCE_IDENTIFIER=rds-pgsql-prd01"
              } >> "$GITHUB_ENV"
              ;;
            preprod)
              {
                echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID_DEV }}"
                echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY_DEV }}"
                echo "AWS_ROLE_EXTERNAL_ID=${{ secrets.AWS_ROLE_EXTERNAL_ID_DEV }}"
                echo "AWS_ROLE_TO_ASSUME=${{ secrets.AWS_ROLE_TO_ASSUME_DEV }}"
                echo "REPO_NAME=${REPO_NAME}"
                echo "EKS_CLUSTER_NAME=gek-ppd"
                echo "environment=preprod"
                echo "NODE_ENV=staging-aws"
                echo "K8S_NAMESPACE=worklib"
                echo "SLACK_WEBHOOK_URL=${{ secrets.PPD_SLACK_WEBHOOK_URL }}"
                echo "DB_INSTANCE_IDENTIFIER=rds-pgsql-ppd"
              } >> "$GITHUB_ENV"
              ;;
            *)
              {
                echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID_DEV }}"
                echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY_DEV }}"
                echo "AWS_ROLE_EXTERNAL_ID=${{ secrets.AWS_ROLE_EXTERNAL_ID_DEV }}"
                echo "AWS_ROLE_TO_ASSUME=${{ secrets.AWS_ROLE_TO_ASSUME_DEV }}"
                echo "REPO_NAME=${REPO_NAME}"
                echo "EKS_CLUSTER_NAME=gek-ppd"
                echo "environment=qa"
                echo "NODE_ENV=qa"
                echo "K8S_NAMESPACE=worklib-qa"
                echo "SLACK_WEBHOOK_URL=${{ secrets.QA_SLACK_WEBHOOK_URL }}"
                echo "DB_INSTANCE_IDENTIFIER=rds-pgsql-ppd"
              } >> "$GITHUB_ENV"
              ;;
          esac

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          role-external-id: ${{ env.AWS_ROLE_EXTERNAL_ID }}
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          role-duration-seconds: 1200
          role-skip-session-tagging: true
          aws-region: eu-west-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Docker pull
        if: inputs.TEST_MODE != true
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.set-tag.outputs.tag }}
        run: |
          echo "Pull image from ECR : $ECR_REGISTRY/${{ env.REPO_NAME }}:$IMAGE_TAG"
          docker pull "$ECR_REGISTRY/${{ env.REPO_NAME }}:$IMAGE_TAG"

      - name: DB snapshot
        if: inputs.NEEDS_MIGRATION == true
        run: |
          snapshot_name="${{ env.DB_INSTANCE_IDENTIFIER }}-$(date -I)"
          if aws rds describe-db-snapshots \
               --db-instance-identifier "${{ env.DB_INSTANCE_IDENTIFIER }}" \
               --snapshot-type manual \
               --query "DBSnapshots[?DBSnapshotIdentifier=='${snapshot_name}']" \
               --output text | grep -q "${snapshot_name}"; then
            echo "Snapshot déjà existant : ${snapshot_name}, attente de sa complétion..."
            aws rds wait db-snapshot-completed --db-snapshot-identifier "${snapshot_name}"
          else
            echo "Création du snapshot : ${snapshot_name}"
            aws rds create-db-snapshot \
              --db-instance-identifier "${{ env.DB_INSTANCE_IDENTIFIER }}" \
              --db-snapshot-identifier "${snapshot_name}"
            aws rds wait db-snapshot-completed --db-snapshot-identifier "${snapshot_name}"
          fi
          echo "Suppression des snapshots de plus de 60 jours"
          oldsnap=$(date -I --date "now -60 days")
          old_snaps=$(aws rds describe-db-snapshots \
            --db-instance-identifier "${{ env.DB_INSTANCE_IDENTIFIER }}" \
            --snapshot-type manual \
            --output text \
            --query "DBSnapshots[?SnapshotCreateTime<'${oldsnap}'].DBSnapshotIdentifier")
          for snap in $old_snaps; do
            aws rds delete-db-snapshot --db-snapshot-identifier "$snap" || echo "Erreur suppression $snap (non critique)"
          done

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Deploy to EKS Cluster
        env:
          IMAGE_TAG: ${{ steps.set-tag.outputs.tag }}
          MICROSERVICE_SHORT_NAME: ${{ steps.set-tag.outputs.microservice_short_name }}
        run: |
          aws eks update-kubeconfig --name=${{ env.EKS_CLUSTER_NAME }}
          cd deploy/k8s_ci/
          ./replace_parameters.sh ${{ env.environment }} ${{ env.NODE_ENV }} $MICROSERVICE_SHORT_NAME $IMAGE_TAG
          cd -

          if [[ "${{ inputs.TEST_MODE }}" == "true" ]]; then
            echo "DRY RUN — commandes qui seraient exécutées :"
            [[ "${{ inputs.NEEDS_MIGRATION }}" == "true" ]] && echo "  kubectl delete job job-$MICROSERVICE_SHORT_NAME-migration -n ${{ env.K8S_NAMESPACE }}"
            echo "  kubectl apply -k deploy/k8s_ci/overlays/${{ env.environment }}"
            [[ "${{ inputs.NEEDS_MIGRATION }}" == "true" ]] && echo "  kubectl wait --for=condition=complete job/job-$MICROSERVICE_SHORT_NAME-migration ..."
            echo "  kubectl rollout status deployment service-$MICROSERVICE_SHORT_NAME -n ${{ env.K8S_NAMESPACE }}"
          else
            if [[ "${{ inputs.NEEDS_MIGRATION }}" == "true" ]]; then
              kubectl delete job job-$MICROSERVICE_SHORT_NAME-migration -n ${{ env.K8S_NAMESPACE }} || echo "Job migration absent, OK"
            fi
            kubectl apply -k deploy/k8s_ci/overlays/${{ env.environment }}
            if [[ "${{ inputs.NEEDS_MIGRATION }}" == "true" ]]; then
              kubectl wait --for=condition=complete job/job-$MICROSERVICE_SHORT_NAME-migration --timeout=150s -n ${{ env.K8S_NAMESPACE }}
              kubectl logs job/job-$MICROSERVICE_SHORT_NAME-migration -n ${{ env.K8S_NAMESPACE }}
            fi
            kubectl rollout status deployment service-$MICROSERVICE_SHORT_NAME -n ${{ env.K8S_NAMESPACE }}
          fi

  notification:
    needs: deploy
    if: always()
    name: slackNotificationResult
    runs-on: ubuntu-latest
    steps:
      - name: Set Slack webhook URL
        run: |
          case "${{ inputs.TARGET_ENV }}" in
            production)
              echo "SLACK_WEBHOOK_URL=${{ secrets.PRD_SLACK_WEBHOOK_URL }}" >> "$GITHUB_ENV" ;;
            preprod)
              echo "SLACK_WEBHOOK_URL=${{ secrets.PPD_SLACK_WEBHOOK_URL }}" >> "$GITHUB_ENV" ;;
            *)
              echo "SLACK_WEBHOOK_URL=${{ secrets.QA_SLACK_WEBHOOK_URL }}" >> "$GITHUB_ENV" ;;
          esac
      - name: Send notification to Slack
        uses: slackapi/slack-github-action@v1.18.0
        with:
          payload: |
            {
              "blocks": [
                {
                  "type": "context",
                  "elements": [
                    { "type": "image", "image_url": "https://worklib-storage-prod.s3.eu-west-1.amazonaws.com/system/${{ needs.deploy.result }}.png", "alt_text": "status icon" },
                    { "type": "mrkdwn", "text": "The <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}?check_suite_focus=true|${{ needs.deploy.outputs.deploy_type }}> finished for `${{ needs.deploy.outputs.microservice }}` with status: *${{ needs.deploy.result }}*" }
                  ]
                },
                { "type": "divider" }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ env.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
