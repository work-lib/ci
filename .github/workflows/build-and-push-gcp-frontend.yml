name: Build & Push GCP — Frontend Monorepo (Staging/Linear)

# ============================================================
# Workflow réutilisable pour le monorepo frontend.
# Construit web-app, host-app, landing-page et back-office en parallèle,
# puis met à jour web/patches/<project>.override.yml dans sysadmin
# et déploie le stack web sur la VM staging.
#
# Usage :
#   uses: work-lib/ci/.github/workflows/build-and-push-gcp-frontend.yml@dev
# ============================================================

on:
  workflow_call:
    inputs:
      APPS:
        description: "JSON build matrix; defaults to all four frontends"
        required: false
        type: string
        default: '[{"app":"web-app","dockerfile":"web-app.dockerfile","image":"web-app"},{"app":"host-app","dockerfile":"host-app.dockerfile","image":"host-app"},{"app":"landing-page","dockerfile":"landing-page.dockerfile","image":"landing-page"},{"app":"back-office","dockerfile":"back-office.dockerfile","image":"back-office"}]'
      NEEDS_DEPLOY:
        description: "Activer le déploiement sur staging"
        required: false
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

env:
  GAR_REGISTRY: europe-west9-docker.pkg.dev
  GCP_PROJECT: officeriders-493413
  GAR_REPO: officeriders
  GCP_ZONE: europe-west9-a
  STAGING_VM: staging
  SYSADMIN_REPO: work-lib/sysadmin
  SYSADMIN_PATH: /root/sysadmin
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/708989881939/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  GCP_SERVICE_ACCOUNT: github-actions@officeriders-493413.iam.gserviceaccount.com

jobs:

  # ==========================================================
  # 1. Contexte : linear_id + image_tag
  # ==========================================================
  context:
    name: Determine context
    runs-on: ubuntu-latest
    outputs:
      deploy_type: ${{ steps.ctx.outputs.deploy_type }}
      linear_id:   ${{ steps.ctx.outputs.linear_id }}
      project:     ${{ steps.ctx.outputs.project }}
      image_tag:   ${{ steps.ctx.outputs.image_tag }}
    steps:
      - name: Compute
        id: ctx
        run: |
          REF_NAME="${{ github.ref_name }}"
          LINEAR_ID=$(echo "$REF_NAME" | grep -oiP '[A-Z]{2,8}-\d+' | head -1 | tr '[:lower:]' '[:upper:]' || true)

          if [[ -n "$LINEAR_ID" ]]; then
            DEPLOY_TYPE="staging"
            IMAGE_TAG="${LINEAR_ID,,}-${{ github.run_number }}"
          else
            DEPLOY_TYPE="none"
            IMAGE_TAG="sha-${GITHUB_SHA::8}"
          fi

          echo "deploy_type=$DEPLOY_TYPE" >> "$GITHUB_OUTPUT"
          echo "linear_id=$LINEAR_ID"     >> "$GITHUB_OUTPUT"
          echo "project=${LINEAR_ID,,}"   >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG"     >> "$GITHUB_OUTPUT"

  # ==========================================================
  # 2. Build & Push — matrix sur les 4 apps
  # ==========================================================
  build:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    needs: context
    if: needs.context.outputs.deploy_type != 'none'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.APPS) }}

    steps:
      # Checkout avant Auth GCP (évite l'écrasement du fichier credentials)
      - name: Checkout
        uses: actions/checkout@v7

      - name: Auth GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker pour GAR
        run: gcloud auth configure-docker ${{ env.GAR_REGISTRY }} --quiet

      - name: Fetch translation secret (Bitwarden)
        if: matrix.app == 'web-app' || matrix.app == 'host-app'
        uses: work-lib/ci/.github/actions/bw-fetch@dev
        with:
          items: |
            API_GATEWAY_STAGING:API_GATEWAY_STAGING_ENV:notes

      - name: Prepare translation build secret
        if: matrix.app == 'web-app' || matrix.app == 'host-app'
        run: |
          set -euo pipefail

          NOTION_ACCESS_TOKEN="$(printf '%s\n' "$API_GATEWAY_STAGING_ENV" \
            | awk -F= '$1 == "TRANSLATIONS_NOTION_ACCESS_TOKEN" {print substr($0, index($0, "=") + 1); exit}')"

          if [[ -z "$NOTION_ACCESS_TOKEN" ]]; then
            echo "TRANSLATIONS_NOTION_ACCESS_TOKEN absent de API_GATEWAY_STAGING"
            exit 1
          fi

          echo "::add-mask::$NOTION_ACCESS_TOKEN"
          printf 'NOTION_ACCESS_TOKEN=%s\n' "$NOTION_ACCESS_TOKEN" >> "$GITHUB_ENV"

      - name: Verify back-office backend isolation
        if: matrix.app == 'back-office'
        run: |
          set -euo pipefail
          docker build --file back-office.dockerfile --target deps-install --tag bo-test-dependencies .
          git archive HEAD | docker run --rm -i bo-test-dependencies sh -c '
            tar -xf - -C /repo
            cd /repo/apps/back-office
            node ../../node_modules/vitest/vitest.mjs run \
              src/utils/environments.test.ts \
              src/utils/server/apiBaseUrl.test.ts \
              src/utils/server/currentEnvironment.test.ts \
              src/utils/server/systemApiKey.test.ts \
              src/app/api/internal/environment/route.test.ts \
              src/components/layout/EnvironmentSelect.test.tsx --maxWorkers=2'

      - name: Build & Push ${{ matrix.app }}
        run: |
          IMAGE_URL="${{ env.GAR_REGISTRY }}/${{ env.GCP_PROJECT }}/${{ env.GAR_REPO }}/${{ matrix.image }}:${{ needs.context.outputs.image_tag }}"
          LATEST_URL="${{ env.GAR_REGISTRY }}/${{ env.GCP_PROJECT }}/${{ env.GAR_REPO }}/${{ matrix.image }}:latest"

          SECRET_ARGS=()
          if [[ -n "${NOTION_ACCESS_TOKEN:-}" ]]; then
            SECRET_ARGS+=(--secret id=notion_access_token,env=NOTION_ACCESS_TOKEN)
          fi

          docker build \
            --file "${{ matrix.dockerfile }}" \
            --tag "$IMAGE_URL" \
            --label "git-commit=${{ github.sha }}" \
            --label "git-ref=${{ github.ref_name }}" \
            --cache-from "$LATEST_URL" \
            "${SECRET_ARGS[@]}" \
            .

          docker push "$IMAGE_URL"

  # ==========================================================
  # 3. Update sysadmin — un seul commit pour les 3 apps
  # ==========================================================
  update-sysadmin:
    concurrency:
      group: gcp-staging-config-${{ github.ref_name }}
      cancel-in-progress: false
    name: Update sysadmin
    runs-on: ubuntu-latest
    needs: [context, build]
    if: inputs.NEEDS_DEPLOY && needs.context.outputs.deploy_type == 'staging'

    steps:
      - name: Auth GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Fetch secrets (Bitwarden)
        uses: work-lib/ci/.github/actions/bw-fetch@dev
        with:
          items: |
            CI_SYSADMIN_DEPLOY_KEY:SYSADMIN_DEPLOY_KEY:notes

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ env.SYSADMIN_DEPLOY_KEY }}

      - name: Checkout sysadmin
        uses: actions/checkout@v7
        with:
          repository: ${{ env.SYSADMIN_REPO }}
          ssh-key: ${{ env.SYSADMIN_DEPLOY_KEY }}
          ref: main

      - name: Install yq
        run: |
          wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.45.4/yq_linux_amd64
          chmod +x /usr/local/bin/yq

      - name: Publish staging versions atomically
        env:
          PROJECT: ${{ needs.context.outputs.project }}
          TAG: ${{ needs.context.outputs.image_tag }}
          APP_MATRIX: ${{ inputs.APPS }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          for attempt in $(seq 1 10); do
            # Always reapply only our image on the latest snapshot; a shallow
            # rebase can mistake neighboring image updates for file additions.
            git fetch --depth=1 origin main
            git checkout --detach FETCH_HEAD
            OVERRIDE="web/patches/${PROJECT}.override.yml"
            mkdir -p web/patches
            [[ -f "$OVERRIDE" ]] || printf 'services: {}\n' > "$OVERRIDE"
            CURRENT=$(yq -r '.services."web-webapp".image // ""' "$OVERRIDE")
            if [[ "$CURRENT" =~ :${PROJECT}-([0-9]+) ]] && (( BASH_REMATCH[1] > GITHUB_RUN_NUMBER )); then
              echo 'Newer frontend build already selected'; exit 0
            fi
            GAR="${{ env.GAR_REGISTRY }}/${{ env.GCP_PROJECT }}/${{ env.GAR_REPO }}"
            while IFS= read -r app; do
              case "$app" in
                web-app) SERVICE=web-webapp ;;
                host-app) SERVICE=web-hostapp ;;
                landing-page) SERVICE=web-landing ;;
                back-office) SERVICE=web-backoffice ;;
                *) echo 'Unsupported frontend application' >&2; exit 1 ;;
              esac
              SERVICE="$SERVICE" IMAGE="${GAR}/${app}:${TAG}" yq -i '.services[strenv(SERVICE)].image = strenv(IMAGE)' "$OVERRIDE"
            done < <(jq -r '.[].image' <<< "$APP_MATRIX")
            git add "$OVERRIDE"
            git diff --cached --quiet && exit 0
            git commit -m "deploy(staging): ${PROJECT} ${TAG}"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          echo 'Unable to publish staging versions after retries' >&2
          exit 1

  deploy:
    name: Deploy GCP staging
    runs-on: ubuntu-latest
    needs: [context, update-sysadmin]
    if: inputs.NEEDS_DEPLOY && needs.context.outputs.deploy_type == 'staging'

    timeout-minutes: 90
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Load staging SSH and sysadmin checkout credentials
        uses: work-lib/ci/.github/actions/bw-fetch@dev
        with:
          items: |
            CI_STAGING_SSH_KEY:STAGING_SSH_KEY:notes
            CI_SYSADMIN_DEPLOY_KEY:SYSADMIN_DEPLOY_KEY:notes
      - uses: actions/checkout@v4
        with:
          repository: work-lib/sysadmin
          ref: main
          ssh-key: ${{ env.SYSADMIN_DEPLOY_KEY }}
          path: sysadmin-snapshot
          fetch-depth: 0
      - name: Migrate and deploy staging through IAP
        env:
          TICKET: ${{ needs.context.outputs.linear_id }}
        run: |
          set -euo pipefail
          umask 077
          KEY="$RUNNER_TEMP/gcp-staging-ssh"
          trap 'rm -f "$KEY"' EXIT
          test -n "${STAGING_SSH_KEY:-}"
          printf '%s\n' "$STAGING_SSH_KEY" > "$KEY"
          unset STAGING_SSH_KEY SYSADMIN_DEPLOY_KEY
          python3 sysadmin-snapshot/scripts/ci/deploy-gcp.py staging --ticket "$TICKET" --key "$KEY"
          echo "Staging: https://${TICKET,,}.staging.worklib.io" >> "$GITHUB_STEP_SUMMARY"
