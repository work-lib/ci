# Build et push d'un seul produit (app) - réutilisable par tout monorepo
# Utilisé avec ENVIRONMENT pour cibler dev / autotest / staging / main (build only)

name: Build one product

on:
  workflow_call:
    inputs:
      ENVIRONMENT:
        description: "Environnement cible (dev=qa, autotest, staging, main=build only)"
        type: string
        required: true
        default: "dev"
      MICROSERVICE:
        description: "Nom du produit/app à builder (ex: web-app, host-app)"
        type: string
        required: true
      IMAGE_TAG:
        type: string
        required: false
      NEEDS_MIGRATION:
        type: boolean
        required: false
        default: false
      NEEDS_IMAGE_BUILD:
        type: boolean
        required: false
        default: true
      ECR_REPOSITORY:
        type: string
        required: false
      PRODUCTION_BRANCH:
        type: string
        required: false
        default: "main"
    secrets:
      WORKLIB_GITHUB_SSH_KEY:
        required: true
      AWS_ACCESS_KEY_ID_DEV:
        required: true
      AWS_SECRET_ACCESS_KEY_DEV:
        required: true
      AWS_ROLE_EXTERNAL_ID_DEV:
        required: true
      AWS_ROLE_TO_ASSUME_DEV:
        required: true
      QA_SLACK_WEBHOOK_URL:
        required: true
      PPD_SLACK_WEBHOOK_URL:
        required: true
      AWS_ACCESS_KEY_ID_PROD:
        required: true
      AWS_SECRET_ACCESS_KEY_PROD:
        required: true
      AWS_ROLE_EXTERNAL_ID_PROD:
        required: true
      AWS_ROLE_TO_ASSUME_PROD:
        required: true
      PRD_SLACK_WEBHOOK_URL:
        required: true
      NOTION_ACCESS_TOKEN:
        required: false

jobs:
  build:
    name: build-${{ inputs.MICROSERVICE }}
    timeout-minutes: 20
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.set-tag.outputs.branch }}
      microservice: ${{ steps.set-tag.outputs.microservice_short_name }}
      deploy_type: ${{ steps.set-tag.outputs.deploy_type }}
      migration_list: ${{ steps.set-tag.outputs.migration_list }}
      needs_deploy: ${{ steps.set-tag.outputs.needs_deploy }}

    steps:
      - name: Deployment details
        run: |
          echo "Pipeline run by '${{ github.event_name }}' on ${{ github.ref_type }} '${{ github.ref_name }}'"
          echo "ENVIRONMENT=${{ inputs.ENVIRONMENT }} MICROSERVICE=${{ inputs.MICROSERVICE }}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.ref_name }}

      - name: Set tag and env
        id: set-tag
        run: |
          MICROSERVICE="${{ inputs.MICROSERVICE }}"

          if [[ -n "${{ inputs.IMAGE_TAG }}" ]]; then
            GIT_TAG="${{ inputs.IMAGE_TAG }}"
          else
            ref_part="${GITHUB_REF#refs/heads/}"
            ref_part="${ref_part#refs/tags/}"
            GIT_TAG=$(echo "$ref_part" | tr / -)
            if [[ ! "${MICROSERVICE}" =~ ^service- ]]; then
              GIT_TAG="${GIT_TAG}-${MICROSERVICE}"
            fi
          fi

          if [[ -n "${{ inputs.ECR_REPOSITORY }}" ]]; then
            ECR_REPOSITORY="${{ inputs.ECR_REPOSITORY }}"
          else
            ECR_REPOSITORY="gekko/$(echo ${GITHUB_REPOSITORY} | awk -F'/' '{ print $NF}')"
          fi

          ENV_INPUT="${{ inputs.ENVIRONMENT }}"
          case "${ENV_INPUT}" in
            dev)       GIT_BRANCH="dev"; deploy_type="deployment"; needs_push=true; needs_deploy=true ;;
            autotest)  GIT_BRANCH="autotest"; deploy_type="autotest"; needs_push=true; needs_deploy=true ;;
            staging)   GIT_BRANCH="staging"; deploy_type="deployment"; needs_push=true; needs_deploy=true ;;
            main)      GIT_BRANCH="${{ inputs.PRODUCTION_BRANCH }}"; deploy_type="docker image build"; needs_push=false; needs_deploy=false ;;
            *)         echo "Unknown ENVIRONMENT: ${ENV_INPUT}"; exit 1 ;;
          esac

          MICROSERVICE_SHORT_NAME=$(echo "${MICROSERVICE}" | awk -F'service-' '{ print $NF}')

          # Calcul des migrations uniquement si nécessaire (évite un fetch-depth: 0 coûteux)
          migrationList=""
          if [[ "${{ inputs.NEEDS_MIGRATION }}" == "true" ]]; then
            git fetch origin ${{ inputs.PRODUCTION_BRANCH }} --depth=50 2>/dev/null || true
            migrationList=$(git diff origin/${{ inputs.PRODUCTION_BRANCH }} HEAD --name-only --diff-filter=d 2>/dev/null | grep migrations/ | awk '{printf "%s\\n", $0}' || true)
          fi

          if [[ ! "${MICROSERVICE}" =~ ^service- ]]; then
            DOCKERFILE="${MICROSERVICE}.dockerfile"
          else
            DOCKERFILE="Dockerfile_k8s"
          fi

          echo "branch=$GIT_BRANCH" >> $GITHUB_OUTPUT
          echo "tag=$GIT_TAG" >> $GITHUB_OUTPUT
          echo "microservice=$MICROSERVICE" >> $GITHUB_OUTPUT
          echo "microservice_short_name=$MICROSERVICE_SHORT_NAME" >> $GITHUB_OUTPUT
          echo "deploy_type=$deploy_type" >> $GITHUB_OUTPUT
          echo "ECR_REPOSITORY=$ECR_REPOSITORY" >> $GITHUB_OUTPUT
          echo "dockerfile=$DOCKERFILE" >> $GITHUB_OUTPUT
          echo "needs_push=$needs_push" >> $GITHUB_OUTPUT
          echo "needs_deploy=$needs_deploy" >> $GITHUB_OUTPUT
          echo "migration_list<<|" >> $GITHUB_OUTPUT
          echo "$migrationList" >> $GITHUB_OUTPUT
          echo "|" >> $GITHUB_OUTPUT

      - name: Map environment config
        id: env-config
        run: |
          case "${{ steps.set-tag.outputs.branch }}" in
            "${{ inputs.PRODUCTION_BRANCH }}")
              {
                echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID_PROD }}"
                echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}"
                echo "AWS_ROLE_EXTERNAL_ID=${{ secrets.AWS_ROLE_EXTERNAL_ID_PROD }}"
                echo "AWS_ROLE_TO_ASSUME=${{ secrets.AWS_ROLE_TO_ASSUME_PROD }}"
                echo "EKS_CLUSTER_NAME=gek-prd"
                echo "environment=production"
                echo "K8S_NAMESPACE=worklib"
                echo "SLACK_WEBHOOK_URL=${{ secrets.PRD_SLACK_WEBHOOK_URL }}"
              } >> "$GITHUB_ENV"
              ;;
            staging)
              {
                echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID_DEV }}"
                echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY_DEV }}"
                echo "AWS_ROLE_EXTERNAL_ID=${{ secrets.AWS_ROLE_EXTERNAL_ID_DEV }}"
                echo "AWS_ROLE_TO_ASSUME=${{ secrets.AWS_ROLE_TO_ASSUME_DEV }}"
                echo "ECR_REPOSITORY=${{ steps.set-tag.outputs.ECR_REPOSITORY }}"
                echo "EKS_CLUSTER_NAME=gek-ppd"
                echo "environment=preprod"
                echo "K8S_NAMESPACE=worklib"
                echo "SLACK_WEBHOOK_URL=${{ secrets.PPD_SLACK_WEBHOOK_URL }}"
              } >> "$GITHUB_ENV"
              ;;
            autotest)
              {
                echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID_DEV }}"
                echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY_DEV }}"
                echo "AWS_ROLE_EXTERNAL_ID=${{ secrets.AWS_ROLE_EXTERNAL_ID_DEV }}"
                echo "AWS_ROLE_TO_ASSUME=${{ secrets.AWS_ROLE_TO_ASSUME_DEV }}"
                echo "ECR_REPOSITORY=${{ steps.set-tag.outputs.ECR_REPOSITORY }}"
                echo "EKS_CLUSTER_NAME=gek-ppd"
                echo "environment=autotest"
                echo "K8S_NAMESPACE=autotest"
                echo "SLACK_WEBHOOK_URL=${{ secrets.QA_SLACK_WEBHOOK_URL }}"
              } >> "$GITHUB_ENV"
              ;;
            *)
              {
                echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID_DEV }}"
                echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY_DEV }}"
                echo "AWS_ROLE_EXTERNAL_ID=${{ secrets.AWS_ROLE_EXTERNAL_ID_DEV }}"
                echo "AWS_ROLE_TO_ASSUME=${{ secrets.AWS_ROLE_TO_ASSUME_DEV }}"
                echo "ECR_REPOSITORY=${{ steps.set-tag.outputs.ECR_REPOSITORY }}"
                echo "EKS_CLUSTER_NAME=gek-ppd"
                echo "environment=qa"
                echo "K8S_NAMESPACE=worklib-qa"
                echo "SLACK_WEBHOOK_URL=${{ secrets.QA_SLACK_WEBHOOK_URL }}"
              } >> "$GITHUB_ENV"
              ;;
          esac

      - name: Send notification to Slack
        if: steps.set-tag.outputs.needs_deploy == 'true'
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ env.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "${{ steps.set-tag.outputs.deploy_type }} started for `${{ env.environment }}` on `${{ steps.set-tag.outputs.microservice_short_name }}`",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*${{ github.actor }}* started the <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}?check_suite_focus=true|${{ steps.set-tag.outputs.deploy_type }}> on `${{ env.environment }}` for `${{ steps.set-tag.outputs.microservice_short_name }}` ${{ github.ref_type }} `${{ github.ref_name }}`"
                  }
                }
              ]
            }

      - name: Check SSH key availability
        id: ssh-check
        if: inputs.NEEDS_IMAGE_BUILD == true
        run: |
          if [[ -n "${{ secrets.WORKLIB_GITHUB_SSH_KEY }}" ]]; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup SSH agent
        if: inputs.NEEDS_IMAGE_BUILD == true && steps.ssh-check.outputs.available == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.WORKLIB_GITHUB_SSH_KEY }}

      - name: Configure AWS credentials
        if: inputs.NEEDS_IMAGE_BUILD == true && steps.set-tag.outputs.needs_push == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          role-external-id: ${{ env.AWS_ROLE_EXTERNAL_ID }}
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          role-duration-seconds: 1200
          role-skip-session-tagging: true
          aws-region: eu-west-1

      - name: Login to Amazon ECR
        if: inputs.NEEDS_IMAGE_BUILD == true && steps.set-tag.outputs.needs_push == 'true'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Prepare image tag
        id: image-tag
        if: inputs.NEEDS_IMAGE_BUILD == true
        run: |
          if [ "${{ steps.set-tag.outputs.needs_push }}" = "true" ]; then
            REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          else
            REGISTRY="local"
          fi
          IMAGE_FULL="${REGISTRY}/${{ steps.set-tag.outputs.ECR_REPOSITORY }}:${{ steps.set-tag.outputs.tag }}"
          echo "image=${IMAGE_FULL}" >> $GITHUB_OUTPUT

      - name: Build Docker image
        id: build-image-service
        if: inputs.NEEDS_IMAGE_BUILD == true
        env:
          IMAGE_FULL: ${{ steps.image-tag.outputs.image }}
          NOTION_ACCESS_TOKEN: ${{ secrets.NOTION_ACCESS_TOKEN }}
        run: |
          # SSH agent configuré par le step précédent si WORKLIB_GITHUB_SSH_KEY est défini
          SSH_ARGS=""
          [[ -n "${{ secrets.WORKLIB_GITHUB_SSH_KEY }}" ]] && SSH_ARGS="--ssh default"
          docker build \
            $SSH_ARGS \
            --secret id=notion_access_token,env=NOTION_ACCESS_TOKEN \
            -f ./${{ steps.set-tag.outputs.dockerfile }} \
            -t $IMAGE_FULL \
            .
          echo "image=$IMAGE_FULL" >> $GITHUB_OUTPUT

      - name: Push image to ECR
        if: inputs.NEEDS_IMAGE_BUILD == true && steps.set-tag.outputs.needs_push == 'true'
        run: docker push ${{ steps.build-image-service.outputs.image }}

      - name: Setup kubectl
        if: steps.set-tag.outputs.needs_deploy == 'true'
        uses: azure/setup-kubectl@v3

      - name: Deploy to EKS Cluster
        if: steps.set-tag.outputs.needs_deploy == 'true'
        env:
          IMAGE_TAG: ${{ steps.set-tag.outputs.tag }}
          MICROSERVICE_SHORT_NAME: ${{ steps.set-tag.outputs.microservice_short_name }}
          MICROSERVICE: ${{ steps.set-tag.outputs.microservice }}
        run: |
          if [[ "${{ env.environment }}" == "production" ]]; then
            echo "Deploy to production is not allowed from this workflow."
            exit 1
          fi
          aws eks update-kubeconfig --name=${{ env.EKS_CLUSTER_NAME }}
          deploy_dir="deploy/k8s_ci"
          if [[ ! "$MICROSERVICE" =~ ^service- ]]; then
            deploy_dir="$deploy_dir/$MICROSERVICE"
          fi
          cd $deploy_dir
          chmod +x ./replace_parameters.sh
          ./replace_parameters.sh ${{ env.environment }} "NOTIMPORTANT" $MICROSERVICE_SHORT_NAME $IMAGE_TAG
          cd -
          if [[ "${{ inputs.NEEDS_MIGRATION }}" == "true" ]]; then
            kubectl delete job job-$MICROSERVICE_SHORT_NAME-migration -n ${{ env.K8S_NAMESPACE }} || true
          fi
          kubectl apply -k ${deploy_dir}/overlays/${{ env.environment }}
          if [[ "${{ inputs.NEEDS_MIGRATION }}" == "true" ]]; then
            kubectl wait --for=condition=complete job/job-$MICROSERVICE_SHORT_NAME-migration --timeout=150s -n ${{ env.K8S_NAMESPACE }}
            kubectl logs job/job-$MICROSERVICE_SHORT_NAME-migration -n ${{ env.K8S_NAMESPACE }}
            if [ "$(kubectl -n ${{ env.K8S_NAMESPACE }} get jobs job-$MICROSERVICE_SHORT_NAME-migration -o jsonpath='{.status.conditions[?(@.type=="Failed")].status}')" = "True" ]; then
              echo "DB migration failed"
              exit 1
            fi
          fi
          kubectl rollout status deployment $MICROSERVICE -n ${{ env.K8S_NAMESPACE }}

  notification:
    needs: build
    if: always() && needs.build.outputs.needs_deploy == 'true'
    name: slackNotificationResult
    runs-on: ubuntu-latest
    steps:
      - name: Set Slack webhook URL
        run: |
          case "${{ needs.build.outputs.branch }}" in
            "${{ inputs.PRODUCTION_BRANCH }}")
              echo "SLACK_WEBHOOK_URL=${{ secrets.PRD_SLACK_WEBHOOK_URL }}" >> "$GITHUB_ENV" ;;
            staging)
              echo "SLACK_WEBHOOK_URL=${{ secrets.PPD_SLACK_WEBHOOK_URL }}" >> "$GITHUB_ENV" ;;
            *)
              echo "SLACK_WEBHOOK_URL=${{ secrets.QA_SLACK_WEBHOOK_URL }}" >> "$GITHUB_ENV" ;;
          esac
      - name: Send notification to Slack
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ env.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "blocks": [
                {
                  "type": "context",
                  "elements": [
                    { "type": "image", "image_url": "https://worklib-storage-prod.s3.eu-west-1.amazonaws.com/system/${{ needs.build.result }}.png", "alt_text": "status" },
                    { "type": "mrkdwn", "text": "The <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}?check_suite_focus=true|${{ needs.build.outputs.deploy_type }}> finished for `${{ needs.build.outputs.microservice }}` with status: *${{ needs.build.result }}*" }
                  ]
                },
                { "type": "divider" }
              ]
            }
